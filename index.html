  function uploadPage(){const selected=!!library.draft;return `<div class="page-head"><div><div class="eyebrow">ADD A NEW QUESTION</div><h1>从一张题图开始</h1><p>先选好题目，再把信息整理成一份可回看的资料。</p></div>${button('返回资料库','back-library','ghost','','left')}</div>${steps(1)}<div class="upload-layout"><section class="panel upload-panel"><div class="section-head"><h2>选择题目图片</h2>${badge('演示上传','gold')}</div><p class="muted">本次使用预置题图，不需要选择本机文件，也不会发送到服务器。</p>${selected?`<div class="selected-image"><button class="image-preview-btn" data-act="zoom-image" type="button"><img src="${seed.example.image}" alt="已选择的三棱柱演示题图"><span>${icon('eye')}放大查看原题</span></button><div class="file-row"><span class="file-symbol">${icon('image')}</span><div><strong>${esc(seed.example.filename)}</strong><small>PNG · ${Math.round(seed.example.fileSize/1024)} KB · 预置示例</small></div>${badge('已选择','green')}</div></div>`:`<div class="upload-drop"><span class="upload-symbol">${icon('upload')}</span><h3>用一道立体几何题，走完整理流程</h3><p>题图已经为答辩准备好，点击选择即可。</p>${button('选择预置题图','pick-image','primary','','image')}<small>原创题图 · 三棱柱与棱上中点 · PNG</small></div>`}<div class="upload-bottom"><span class="muted">${selected?'题图已就绪，接下来查看解析结果。':'选择题图后，即可开始解析。'}</span><div class="button-row">${selected?button('重新选择','pick-image','ghost'):''}${button('开始解析','start-parse','primary',selected?'':'disabled','arrow')}</div></div></section><aside class="stack"><section class="panel soft"><span class="small-icon">${icon('cube')}</span><h2>这次整理什么？</h2><p>在三棱柱中连接对应棱上的中点，寻找不容易从平面图直接看出的空间关系。</p><div class="tag-row">${seed.example.parsed.tags.map(t=>badge(t)).join('')}</div></section><section class="panel"><h3>题图会变成哪些资料？</h3><ol class="quiet-list"><li>完整题干与待求问题</li><li>已知条件和知识点</li><li>可以回看的讲解与模型</li></ol><div class="notice">本版展示预设解析，不代表已经接入真实 OCR 或 AI 识别。</div></section></aside></div>`;}
  function parsingPage(){return `<div class="page-head"><div><div class="eyebrow">ORGANIZE THE QUESTION</div><h1>把题图整理成清晰的信息</h1><p>这是预设解析演示，完成后请对照图片核对。</p></div></div>${steps(2)}<section class="panel parsing-panel"><div class="parsing-preview"><img src="${seed.example.image}" alt="正在整理的预置题图"><span class="scan-line"></span></div><div class="parsing-info">${badge('预设解析演示','gold')}<h2 id="parsing-title">正在读取预置题图</h2><p>整理题干、已知条件与空间关系…</p><div class="parse-stages">${['读取示例题图','展示预设识别结果','整理题目信息'].map((s,i)=>`<div data-stage="${i}"><b>${i+1}</b><span>${s}</span><em></em></div>`).join('')}</div><p class="scope-note">未发生真实上传，未调用 OCR 或 AI 服务。</p></div></section>`;}
  function parsedPage(){const d=library.draft,meta=d.meta||{},p=seed.example.parsed,exists=C.findExisting(library,seed.example.id);return `<div class="page-head"><div><div class="eyebrow">REVIEW BEFORE SAVING</div><h1>解析完成，核对后再保存</h1><p>把题图和文字对照一遍，让资料保留准确的题意。</p></div>${button('返回选择题图','back-upload','ghost','','left')}</div>${steps(2)}${exists?`<div class="notice good duplicate-notice">这道示例题已在资料库中。再次确认不会重复添加，可以直接打开原资料。${button('打开原资料','open-material','text-btn',`data-id="${exists.id}"`)}</div>`:''}<div class="review-layout"><aside class="stack source-column"><section class="panel"><div class="section-head"><h2>原题图</h2>${badge('预置 PNG')}</div><button type="button" class="image-preview-btn source-image" data-act="zoom-image"><img src="${seed.example.image}" alt="待核对的三棱柱题图"><span>${icon('eye')}放大核对</span></button><p class="scope-note">${esc(seed.example.filename)} · 预设解析结果</p></section><section class="panel soft"><h3>识别到的知识点</h3><div class="tag-row">${p.tags.map(t=>badge(t)).join('')}</div><p>入库后，题图、题干、条件、讲解与模型会保存在同一份资料中。</p></section></aside><div class="stack"><section class="panel"><div class="section-head"><h2>题目信息</h2>${badge('待人工核对','gold')}</div><div class="statement">${esc(p.statement)}</div><div class="condition-grid">${p.conditions.map(c=>`<div><small>${esc(c.label)}</small><strong>${esc(c.value)}</strong></div>`).join('')}</div><h3 class="subheading">需要解决的问题</h3><ol class="task-list">${p.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><details class="solution-preview"><summary>预览配套讲解</summary>${p.solution.map((s,i)=>`<div class="solution-step"><b>${i+1}</b><div><h4>${esc(s.title)}</h4><p>${esc(s.body)}</p></div></div>`).join('')}</details></section><section class="panel save-panel"><h2>整理到我的资料库</h2><form id="save-form" novalidate><label class="field"><span>资料标题</span><input id="material-title" maxlength="80" value="${esc(meta.title||seed.example.title)}" aria-describedby="save-error"></label><label class="field"><span>资料分类</span><select id="material-collection"><option ${meta.collection==='立体几何'||!meta.collection?'selected':''}>立体几何</option><option ${meta.collection==='我的题目'?'selected':''}>我的题目</option></select></label><label class="field"><span>学习备注 <small>可选，最多 300 字</small></span><textarea id="material-note" rows="2" maxlength="300" placeholder="例如：用辅助截面来判断两条线是否垂直。">${esc(meta.note||'')}</textarea></label><label class="check-row"><input id="confirm-parsed" type="checkbox" ${meta.confirmed?'checked':''}><span>我已核对题图、题干和已知条件，确认信息一致。</span></label><div id="save-error" class="form-error" role="alert"></div><div class="save-actions"><small>保存至当前浏览器，刷新后仍可查看。</small><button type="submit" class="btn primary">${icon('plus')}确认并加入资料库</button></div></form></section></div></div>`;}
  function successPage(){const m=library.items.find(m=>m.id===library.lastAddedId);if(!m)return libraryPage();return `<div class="page-head"><div><div class="eyebrow">READY FOR YOUR NEXT REVIEW</div><h1>把这道题，留在学习空间里</h1></div></div>${steps(3)}<section class="success-panel"><div class="success-check">${icon('check')}</div>${badge(library.lastSaveDuplicate?'已存在 · 未重复添加':'已成功保存','green')}<h2>${library.lastSaveDuplicate?'这道题已经在你的资料库中':'已加入我的资料库'}</h2><p>题图、题干、已知条件、讲解与交互模型，已整理在同一份资料中。</p><div class="saved-summary"><img src="${seed.example.image}" alt="已入库题目的题图"><div><span class="collection">${esc(m.collection)}</span><h3>${esc(m.title)}</h3><div class="tag-row">${m.tags.map(t=>badge(t)).join('')}</div><small>${date(m.createdAt)} · ${esc(m.source)}</small></div></div><div class="button-row center">${button('查看这份资料','open-material','primary',`data-id="${m.id}"`,'arrow')}${button('返回资料库','back-library','ghost')}</div><p class="scope-note">资料已保存在本机；退出后重新登录仍可查看。</p></section>`;}
  function materialPage(id){const m=library.items.find(m=>m.id===id);if(!m)return `<section class="panel empty-state"><h2>没有找到这份资料</h2>${button('返回资料库','back-library','primary')}</section>`;const isQuestion=m.kind==='question',hasModel=isQuestion||m.kind==='example';if(modelId!==id){model={...pose(),...(m.parsed?.params||m.params||{})};modelId=id;detailTab='content';}return `<div class="detail-back">${button('返回我的资料库','back-library','text-btn','','left')}<span>${esc(m.collection)} / ${esc(m.typeLabel)}</span></div><header class="detail-head"><div>${badge(m.typeLabel,'green')}<h1>${esc(m.title)}</h1><p>${esc(m.source)} · ${date(m.createdAt)} · 已保存在我的资料库</p><div class="tag-row">${m.tags.map(t=>badge(t)).join('')}</div></div>${badge('已查看')}</header>${hasModel?`<div class="detail-tabs"><button class="${detailTab==='content'?'active':''}" data-act="detail-tab" data-tab="content">${isQuestion?'题目与讲解':'资料内容'}</button><button class="${detailTab==='model'?'active':''}" data-act="detail-tab" data-tab="model">交互模型探索</button></div>`:''}${detailTab==='model'&&hasModel?modelPanel():isQuestion?questionDetail(m):`<div class="article-layout"><article class="panel article-content">${m.sections.map((s,i)=>`<section><span class="article-number">0${i+1}</span><h2>${esc(s.title)}</h2><p>${esc(s.body)}</p></section>`).join('')}</article><aside class="panel soft article-aside">${hasModel?ZModel.render({...pose(),zoom:.9},true):`<span class="article-mark">${icon('book')}</span>`}<h3>把理解留在下一次复习里</h3><p>这是一份可阅读的原创演示资料。也可以把新的题目整理进同一个资料库。</p>${button('整理一道新题','new-question','primary wide','','plus')}</aside></div>`}`;}
  function questionDetail(m){const p=m.parsed;if(!p)return '<section class="panel"><p>这份资料缺少题目信息，请返回资料库重新整理。</p></section>';return `<div class="review-layout"><aside class="stack source-column"><section class="panel"><h2>原始题图</h2><button type="button" class="image-preview-btn source-image" data-act="zoom-image"><img src="${seed.example.image}" alt="已保存的原始题图"><span>${icon('eye')}放大查看</span></button></section>${m.note?`<section class="panel soft"><h3>我的学习备注</h3><p class="user-note">${esc(m.note)}</p></section>`:''}</aside><div class="stack"><section class="panel"><h2>题干与已知条件</h2><p class="statement">${esc(p.statement)}</p><div class="condition-grid">${p.conditions.map(c=>`<div><small>${esc(c.label)}</small><strong>${esc(c.value)}</strong></div>`).join('')}</div><ol class="task-list">${p.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></section><section class="panel"><div class="section-head"><h2>讲解与空间关系</h2>${badge('预设配套讲解')}</div>${p.solution.map((s,i)=>`<div class="solution-step"><b>${i+1}</b><div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div></div>`).join('')}${button('在模型中验证','show-model','primary','','cube')}</section></div></div>`;}
  function modelPanel(){const result=ZGeometry.prism(model);return `<section class="panel model-panel"><div class="section-head"><div><h2>三棱柱中的线段关系</h2><p class="muted">拖动旋转，先观察，再借助辅助截面验证。</p></div>${button('恢复初始视角','reset-model','ghost small','','refresh')}</div><div id="model-scene" class="model-scene">${ZModel.render(model)}</div><div class="model-controls"><div class="button-row">${button('显示辅助截面','model-section','ghost')}${button('验证垂直关系','model-reveal','primary','','check')}</div><div class="model-result" id="model-result">${model.reveal?`AN 与 A₁M 相交且垂直 · ${Math.round(result.pairs.diagonals.angle)}°`:'AN 与 A₁M 的夹角：待验证'}</div></div><div id="model-cutaway">${ZModel.cutaway(model)}</div><p class="scope-note">模型与原题条件保持一致；旋转只改变观察视角，不改变实际空间关系。</p></section>`;}
  function paintModel(){if(!$('#model-scene'))return;$('#model-scene').innerHTML=ZModel.render(model);$('#model-cutaway').innerHTML=ZModel.cutaway(model);$('#model-result').textContent=model.reveal?'AN 与 A₁M 相交且垂直 · 90°':'AN 与 A₁M 的夹角：待验证';}
  function scheduleParse(){cancelTimers();const elapsed=Math.max(0,Date.now()-library.draft.startedAt),milestones=[0,600,1200];parseStage=milestones.filter(t=>elapsed>=t).length-1;updateProgress();if(elapsed>=1800){finishParse();return;}milestones.slice(1).forEach((at,i)=>{if(elapsed<at)timers.push(setTimeout(()=>{parseStage=i+1;updateProgress();},at-elapsed));});timers.push(setTimeout(finishParse,1800-elapsed));}
  function updateProgress(){if(!$('#parsing-title'))return;const labels=['正在读取预置题图','正在展示预设识别结果','正在整理题目信息'];$('#parsing-title').textContent=labels[parseStage]||labels[0];document.querySelectorAll('[data-stage]').forEach((el,i)=>{el.classList.toggle('complete',i<parseStage);el.classList.toggle('current',i===parseStage);el.querySelector('em').textContent=i<parseStage?'已完成':i===parseStage?'进行中':'';});}
  function finishParse(){if(!loggedIn||route!=='parse'||!library.draft||library.draft.status!=='parsing')return;const next=C.clone(library);next.draft.status='parsed';next.draft.meta=next.draft.meta||{title:seed.example.title,collection:'立体几何',note:'',confirmed:false};if(commit(next))render();else{cancelTimers();if($('#parsing-title'))$('#parsing-title').textContent='保存解析结果失败，请返回后重试';}}
  function render(){cancelTimers();closeModal();menuOpen=false;route=location.hash.slice(1)||'library';if(!loggedIn){if(route!=='login'){location.hash='login';return;}$('#app').innerHTML=loginPage();document.title='登录学习空间 · 知序';return;}if(route==='login'){go('library');return;}if((route==='parse'&&(!library.draft||library.draft.status==='selected'))||(route==='success'&&!library.lastAddedId)){go('upload');return;}let html;if(route==='library')html=libraryPage();else if(route==='upload')html=uploadPage();else if(route==='parse')html=library.draft.status==='parsed'?parsedPage():parsingPage();else if(route==='success')html=successPage();else if(route.startsWith('material/'))html=materialPage(route.slice(9));else{go('library');return;}$('#app').innerHTML=shell(html);document.title=(route==='library'?'我的资料库':route.startsWith('material/')?'资料详情':'整理一道新题')+' · 知序';window.scrollTo(0,0);if(route==='parse'&&library.draft.status==='parsing')scheduleParse();}
  function picker(){modal('选择预置的立体几何题图',`<p class="muted">仅使用这张原创演示图，模拟选择文件的过程。</p><img class="picker-image" src="${seed.example.image}" alt="可选择的三棱柱预置题图"><div class="file-row"><span class="file-symbol">${icon('image')}</span><div><strong>${esc(seed.example.filename)}</strong><small>PNG · 预置题图 · 未发生真实上传</small></div></div>`,button('取消','close-modal','ghost')+button('使用这张题图','select-image','primary','','check'));}
  function help(){modal('关于这次中期演示',`<div class="help-content"><p><strong>演示流程：</strong>登录 → 查看已有资料 → 选择预置题图 → 预设解析 → 核对入库 → 重新查看。</p><p>登录为固定演示账号校验；图片与解析已预置，无真实上传、OCR 或 AI 服务。资料保存在当前浏览器，不会在设备之间同步。</p><p>账号 <code>student01</code>，密码 <code>zhixu123</code>。退出后再次登录，资料仍然保留。</p><p>答辩前可重置为最初的 3 份资料，清除本版新增题目、草稿和查看记录。</p></div>`,button('重置本版演示','confirm-reset','ghost','','refresh')+button('我知道了','close-modal','primary'));}
  function logout(){cancelTimers();try{sessionStorage.removeItem(SESSION);}catch{}loggedIn=false;go('login');}
  const actions={
    'fill-account':()=>{$('#username').value=C.USER;$('#password').value=C.PASSWORD;$('#login-error').textContent='';$('#username').focus();},
    'password-toggle':()=>{const input=$('#password'),show=input.type==='password';input.type=show?'text':'password';$('[data-act="password-toggle"]').setAttribute('aria-label',show?'隐藏密码':'显示密码');},
    'close-modal':closeModal,'menu':()=>{menuOpen=!menuOpen;$('.sidebar')?.classList.toggle('open',menuOpen);},help,
    'logout':()=>{if(library.draft)modal('退出学习空间？','<p>未完成的题目草稿会保留在当前浏览器，下次登录可以继续。</p>',button('继续整理','close-modal','ghost')+button('退出登录','confirm-logout','primary'));else logout();},'confirm-logout':logout,
    'back-library':()=>{query='';kind='all';go('library');},'new-question':()=>go('upload'),'back-upload':()=>go('upload'),
    'resume-draft':()=>go(library.draft?.status==='selected'?'upload':'parse'),
    'filter':el=>{kind=el.dataset.kind;render();},'clear-filter':()=>{kind='all';query='';render();},
    'open-material':el=>{const id=el.dataset.id;if(!library.items.some(m=>m.id===id))return;const next=C.clone(library);if(!next.viewed.includes(id))next.viewed.push(id);if(!commit(next))return;detailTab='content';modelId='';go('material/'+id);},
    'pick-image':picker,'select-image':()=>{const next=C.clone(library);next.draft={exampleId:seed.example.id,status:'selected',selectedAt:new Date().toISOString(),meta:{title:seed.example.title,collection:'立体几何',note:'',confirmed:false}};if(commit(next)){closeModal();go('upload');}},
    'start-parse':()=>{if(!library.draft){toast('请先选择预置题图。',true);return;}const next=C.clone(library);next.draft.status='parsing';next.draft.startedAt=Date.now();if(commit(next))go('parse');},
    'zoom-image':()=>modal('原始题图',`<img class="zoomed-image" src="${seed.example.image}" alt="放大的三棱柱题图"><p class="scope-note">原创预置题图，未发生真实上传。</p>`),
    'confirm-reset':()=>modal('重置本版演示？','<p>将移除本版新添加的题目、未完成草稿和查看记录，恢复最初的 3 份资料。</p>',button('取消','close-modal','ghost')+button('确认重置','reset-demo','primary')),
    'reset-demo':()=>{if(commit(C.initialLibrary(seed))){query='';kind='all';modelId='';closeModal();go('library');toast('已恢复为最初的 3 份资料。');}},
    'detail-tab':el=>{detailTab=el.dataset.tab;render();},'show-model':()=>{detailTab='model';render();},
    'model-section':()=>{model.plane=true;model.connectors=true;paintModel();},'model-reveal':()=>{model.reveal=true;model.diagonal=true;paintModel();},'reset-model':()=>{model=pose();paintModel();}
  };
  function saveMeta(){if(!library.draft||!$('#material-title'))return;const next=C.clone(library);next.draft.meta={title:$('#material-title').value,collection:$('#material-collection').value,note:$('#material-note').value,confirmed:$('#confirm-parsed').checked};commit(next);}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled){e.preventDefault();actions[el.dataset.act]?.(el);}});
  document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();const username=$('#username').value,password=$('#password').value;if(!C.authenticate(username,password)){$('#login-error').textContent='演示账号或密码不匹配，请使用下方提供的演示账号。';return;}try{sessionStorage.setItem(SESSION,JSON.stringify({userId:C.USER}));}catch{$('#login-error').textContent='浏览器无法保存演示会话，请允许本站存储后重试。';return;}loggedIn=true;library=load();go('library');}if(e.target.id==='save-form'){e.preventDefault();if(!library.draft||library.draft.status!=='parsed')return;const meta={title:$('#material-title').value,collection:$('#material-collection').value,note:$('#material-note').value,confirmed:$('#confirm-parsed').checked};const result=C.addExample(library,seed.example,meta,new Date().toISOString());if(result.error){$('#save-error').textContent=result.error;return;}const next=result.library;next.draft=null;next.lastAddedId=result.item.id;next.lastSaveDuplicate=result.duplicate;if(commit(next))go('success');}});
  document.addEventListener('input',e=>{if(e.target.id==='library-search'){query=e.target.value;$('#material-grid').innerHTML=cards();$('#result-count').textContent=C.filterMaterials(library.items,{query,kind}).length+' 份资料';}if(['material-title','material-note'].includes(e.target.id))saveMeta();});
  document.addEventListener('change',e=>{if(['material-collection','confirm-parsed'].includes(e.target.id))saveMeta();});
  let drag=null;
  document.addEventListener('pointerdown',e=>{const scene=e.target.closest('#model-scene');if(!scene)return;drag={x:e.clientX,y:e.clientY,yaw:model.yaw,pitch:model.pitch};scene.setPointerCapture(e.pointerId);});
  document.addEventListener('pointermove',e=>{if(!drag)return;model.yaw=drag.yaw+(e.clientX-drag.x)*.009;model.pitch=Math.max(-1.2,Math.min(1.2,drag.pitch+(e.clientY-drag.y)*.008));paintModel();});
  document.addEventListener('pointerup',()=>drag=null);document.addEventListener('pointercancel',()=>drag=null);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#overlay [role="dialog"]')){const items=[...$('#overlay').querySelectorAll('button,a,input,select,textarea')].filter(el=>!el.disabled);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  window.addEventListener('hashchange',render);render();
})();
</script></body></html>
