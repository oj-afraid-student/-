name: Platform checks

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-check.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'platform/**'
      - '.github/workflows/platform-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: platform/.node-version
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
