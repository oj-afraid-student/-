name: zhixu-platform
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: zhixu
      POSTGRES_PASSWORD: zhixu_local_only
      POSTGRES_DB: zhixu
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - zhixu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhixu -d zhixu']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  zhixu_pgdata:
