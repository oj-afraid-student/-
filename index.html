="middle">${fmt(maxD*f,1)}</text>`).join('')}</g><circle cx="${x}" cy="273" r="4" fill="#d9b975"/></svg>`;

  function chart(p,t,kind='v',compare=false) {

  function physicsPage() {

${fmt(state.physics.original.mu)}，τ=${fmt(state.physics.original.tau)} s，g=${fmt(state.physics.original.g)} m/s²。</p></details><details ${state.physics.solution?'open':''}><summary data-act="show-solution">展开验证计算</summary><div id="solution-values">${solutionText(p)}</div></details></section></div><aside class="stack"><section class="panel"><div class="row between"><h2>模型参数</h2>${btn('恢复原题','reset-physics','small ghost')}</div><p class="subtle">改变参数后从 t=0 重算，作为探索变式。</p>${[['m','质量 m',1,4,.5,'kg'],['F','拉力 F',2,12,.5,'N'],['mu','动摩擦因数 μ',.05,.3,.01,''],['v0','初速度 v₀',.5,4,.5,'m/s'],['tau','作用时长 τ',1,5,.5,'s']].map(([k,l,min,max,step,u])=>`<div class="param"><label for="param-${k}">${l}<b><span id="value-${k}">${fmt(p[k])}</span> ${u}</b></label><input id="param-${k}" data-param="${k}" type="range" min="${min}" max="${max}" step="${step}" value="${p[k]}"></div>`).join('')}<label class="check"><input type="checkbox" data-toggle="forces" ${state.physics.forces?'checked':''}>显示实际作用力</label><label class="check" style="margin-top:10px"><input type="checkbox" data-toggle="net" ${state.physics.net?'checked':''}>显示合力（合成箭头）</label><label class="check" style="margin-top:10px"><input type="checkbox" data-toggle="compare" ${state.physics.compare?'checked':''}>与原题曲线比较</label><div id="physics-error" class="notice error">${sum.error?esc(sum.error):''}</div><div class="subtle" style="margin-top:14px">g = ${fmt(p.g)} m/s² · 停止后不反向滑动</div></section><section class="panel soft"><div class="row between"><h2>一步步想明白</h2>${icon('spark')}</div>${hints.slice(0,state.physics.hints).map((h,i)=>`<div class="hint-step"><b>提示 ${i+1}</b>${h}</div>`).join('')}${state.physics.hints===0?'<p>先自己观察，需要时再打开提示。</p>':''}${btn(state.physics.hints>=3?'已展开全部提示':'给我一个提示','physics-hint','small ghost',state.physics.hints>=3?'disabled':'','plus')}</section></aside></div>`;

  function cubeSVG(g,mini=false) {
    const L=g.edge, S=(mini?43:76)*g.zoom;
    const vertices=[[0,0,0],[L,0,0],[L,L,0],[0,L,0],[0,0,L],[L,0,L],[L,L,L],[0,L,L]];
    const pt=([x,y,z])=>{x-=L/2;y-=L/2;z-=L/2;const u=x*Math.cos(g.yaw)-y*Math.sin(g.yaw),h=x*Math.sin(g.yaw)+y*Math.cos(g.yaw);return [u*S+300,(h*Math.sin(g.pitch)-z*Math.cos(g.pitch))*S+(mini?150:226),h*Math.cos(g.pitch)+z*Math.sin(g.pitch)];};
    const p=vertices.map(pt), line=(a,b,attrs)=>`<path d="M${p[a][0]} ${p[a][1]}L${p[b][0]} ${p[b][1]}" ${attrs}/>`;
    const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
    const visible=faces.map(f=>{const a=p[f[0]],b=p[f[1]],c=p[f[2]];return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])<0;});
    const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    const edgeVisible=(a,b)=>faces.some((f,i)=>visible[i]&&f.includes(a)&&f.includes(b));
    const polygons=faces.map((f,i)=>({f,i,depth:f.reduce((n,v)=>n+p[v][2],0)/4})).sort((a,b)=>b.depth-a.depth).filter(({i})=>visible[i]);
    const labels=['A','B','C','D','A₁','B₁','C₁','D₁'];
    const d=L*.1, e=d/Math.sqrt(2), rightAngle=[[L-e,L-e,0],[L-e,L-e,d],[L,L,d]].map(pt);
    const rightMark=g.projection&&!mini?`<path d="M${rightAngle.map(v=>v.slice(0,2).join(' ')).join('L')}" fill="none" stroke="#b18c4c" stroke-width="1.3" aria-label="投影处的直角标记"/>`:'';
    return `<svg viewBox="0 0 600 ${mini?300:450}" ${mini?'aria-hidden="true"':'role="img" aria-label="可旋转正方体模型，空间对角线 AC₁ 在底面上的投影为 AC"'}><defs><pattern id="geo-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#c5d3bf"/></pattern></defs>${!mini?'<rect width="600" height="450" fill="url(#geo-grid)"/>':''}${polygons.map(({f})=>`<polygon points="${f.map(v=>p[v].slice(0,2).join(',')).join(' ')}" fill="#d7e1d0" fill-opacity=".42"/>`).join('')}${g.plane?`<polygon points="${[0,1,2,3].map(v=>p[v].slice(0,2).join(',')).join(' ')}" fill="#98b9a0" opacity=".32"/>`:''}${edges.map(([a,b])=>edgeVisible(a,b)?line(a,b,'stroke="#54785e" stroke-width="1.7" fill="none"'):g.hidden?line(a,b,'stroke="#9fb298" stroke-width="1.3" stroke-dasharray="5 5" fill="none"'):'').join('')}${g.projection?line(0,2,'stroke="#d1a057" stroke-width="2.5" fill="none"')+line(2,6,'stroke="#d1a057" stroke-width="1.7" stroke-dasharray="4 4" fill="none"'):''}${rightMark}${g.diagonal?line(0,6,'stroke="#267a66" stroke-width="3" fill="none"'):''}${!mini?p.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3" fill="#52775b"/><text x="${x+(x<300?-11:10)}" y="${y+(y<225?-10:18)}" fill="#52705a" font-size="14" text-anchor="middle">${labels[i]}</text>`).join(''):''}${!mini?`<text x="25" y="30" font-size="10" fill="#83967c" letter-spacing="1.5">SPATIAL GEOMETRY</text><text x="300" y="423" text-anchor="middle" fill="#87977e" font-size="11">拖动旋转 · 用下方滑块缩放 · 角度不随视角改变</text>`:''}</svg>`;
  }
  function geometryPage() {
    const g=state.geo,hints=['C₁ 在底面 ABCD 上的垂足是 C，因此 AC₁ 的正射影是 AC。','观察直角三角形 ACC₁。线面角是斜线 AC₁ 与投影 AC 的夹角 ∠C₁AC。','AC=a√2、CC₁=a，因此 tan θ=1/√2；改变正方体大小不会改变这个角。'];

    if(el.id==='student-select'){state.selectedStudent=el.value;render();}
    if(el.dataset.review){state.reviews[el.dataset.review]=el.checked;const custom=state.customQuestions.find(q=>q.id===el.dataset.review);if(custom)custom.approval_status=el.checked?'teacher_reviewed':'pending_teacher_review';render();}
    if(el.id==='resource-kind'){state.resourceKind=el.value;state.resourceReviewed=false;render();}
    if(el.id==='resource-reviewed'){state.resourceReviewed=el.checked;persist();}
    if(el.id==='class-assignment'){state.classAssignment=el.value;render();}
    if(el.id==='service-fail'){state.serviceFail=el.checked;persist();toast(el.checked?'已启用服务失败演示。':'已恢复正常演示。');}
    if(route==='confirm'&&el.name&&state.confirmed){const c=state.confirmed;if(Object.hasOwn(c.params,el.name)){c.params[el.name]=el.value===''?null:Number(el.value);c.sources[el.name]='用户补充或修改';if(c.conflicts[el.name]){c.conflicts[el.name].resolved=true;el.closest('.field').querySelector('.condition-source').textContent='用户已手动确认';}persist();}}
  });
  document.addEventListener('dragover',e=>{const zone=e.target.closest('#drop-zone');if(zone){e.preventDefault();zone.classList.add('dragging');}});
  document.addEventListener('dragleave',e=>e.target.closest('#drop-zone')?.classList.remove('dragging'));
  document.addEventListener('drop',e=>{const zone=e.target.closest('#drop-zone');if(zone){e.preventDefault();zone.classList.remove('dragging');handleImage(e.dataTransfer.files[0]);}});
  let drag=null;
  document.addEventListener('pointerdown',e=>{const el=e.target.closest('#geometry-scene');if(!el)return;drag={x:e.clientX,y:e.clientY,yaw:state.geo.yaw,pitch:state.geo.pitch};el.setPointerCapture(e.pointerId);});
  document.addEventListener('pointermove',e=>{if(!drag)return;state.geo.yaw=drag.yaw+(e.clientX-drag.x)*.009;state.geo.pitch=Math.max(-1.2,Math.min(1.2,drag.pitch+(e.clientY-drag.y)*.008));paintGeometry();});
  document.addEventListener('pointerup',()=>{if(drag){drag=null;persist();}});
  document.addEventListener('pointercancel',()=>{drag=null;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();actions[e.target.dataset.act]?.(e.target);}});
  window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(pages[next]&&next!==route){try{history.replaceState(null,'','#'+route);}catch{}navigate(next);}});
  window.addEventListener('beforeunload',()=>{stopPlaying();persist();});
  render();
})();
</script>
</body></html>
